services:
  - type: web
    name: taha-helper-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ORCAROUTER_API_KEY
        sync: false
      - key: ORCAROUTER_MODEL
        value: z-ai/glm-5.3-flash-free
      - key: ORCAROUTER_VISION_MODEL
        value: z-ai/glm-5.3-flash-free
      - key: GROQ_TRANSCRIBE_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: V2FUN_API_KEY
        sync: false
      - key: VADOO_API_KEY
        sync: false

services:
  - type: web
    name: taha-s-helper-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TRANSCRIBE_MODEL
        value: gemini-3.8-flash
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: V2FUN_API_KEY
        sync: false
      - key: VADOO_API_KEY
        sync: false

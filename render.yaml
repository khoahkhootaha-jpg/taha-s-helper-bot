services:
  - type: web
    name: taha-s-helper-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: gemini-3.8-flash
      - key: GROQ_VISION_MODEL
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_API_BASE
        value: https://api.minimax.io
      - key: MINIMAX_VIDEO_MODEL
        value: MiniMax-H3
      - key: MINIMAX_VIDEO_RESOLUTION
        value: 768P
